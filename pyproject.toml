[project]
name = "evidencegraph"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pdfplumber",
    "pgvector>=0.4,<1",
    "pint",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "pyyaml",
    "sentence-transformers>=5.1,<6",
    "spacy",
    "sqlalchemy>=2.0,<2.1",
    "torch==2.14.1+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.14.1; sys_platform == 'darwin'",
    "uvicorn[standard]>=0.29,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.9,<2",
    "pip-audit>=2.7,<3",
    "pytest",
    "pytest-cov>=5,<7",
    "reportlab>=4,<5",
    "ruff>=0.3,<1",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "domain/schemas.py",
    "domain_packs/**",
    "worker/ingestion/**",
    "worker/extraction/**",
    "worker/verification/numeric.py",
    "tests/regression/**",
    "tests/unit/test_*.py",
    "scripts/pdf_spike.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
follow_imports = "silent"
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "eg_common.*",
    "persistence.*",
    "apps.*",
    "worker.orchestration.*",
    "worker.reporting.*",
    "worker.jobqueue",
    "worker.main",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "domain.*",
    "domain_packs.*",
    "worker.ingestion.*",
    "worker.extraction.*",
    "worker.verification.*",
]
ignore_errors = true
